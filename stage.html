<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CCCOWE 2026 Explore360 — Projector View</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/stage.css" />
</head>
<body>

<div class="stage" id="stage">

  <!-- HEADER -->
  <header class="s-header">
    <div>
      <p class="s-eyebrow">CCCOWE 2026 &middot; Explore360</p>
      <h1 class="s-title">The Evolving Chinese Church <span class="accent">Around the Globe</span></h1>
    </div>
    <div class="s-status" id="status">
      <span class="s-live-dot"></span>
      <span id="status-text">Live</span>
    </div>
  </header>

  <!-- KPI BAND -->
  <section class="s-kpis">
    <div class="s-kpi"><div class="s-kpi__num" id="kpi-total">&mdash;</div><div class="s-kpi__label">Responses</div></div>
    <div class="s-kpi"><div class="s-kpi__num" id="kpi-countries">&mdash;</div><div class="s-kpi__label">Countries</div></div>
    <div class="s-kpi"><div class="s-kpi__num" id="kpi-hope">&mdash;<small>/5</small></div><div class="s-kpi__label">Average hope</div></div>
  </section>

  <!-- HERO PANEL (auto-rotating) -->
  <section class="s-hero">
    <div class="s-hero__head">
      <span class="s-hero__q" id="hero-q">Q8</span>
      <h2 class="s-hero__title" id="hero-title">Most pressing tensions</h2>
      <span class="s-hero__sub" id="hero-sub"></span>
    </div>
    <div class="s-hero__body">
      <canvas id="stage-canvas"></canvas>
      <div class="s-await hidden" id="await">
        <div class="s-await__ring"></div>
        <div class="s-await__big">Awaiting responses</div>
        <div class="s-await__sub" id="await-sub">The room appears here live as delegates submit the survey.</div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="s-foot">
    <div class="s-dots" id="dots"></div>
    <div class="s-progress"><div class="s-progress__bar" id="progress"></div></div>
    <div class="s-foot__hint" id="hint">Auto-rotating &middot; updates live</div>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/questions.js"></script>
<script src="js/sheet-data.js"></script>
<script src="js/stage.js"></script>
</body>
</html>
